name: Generate Metrics Charts

# Ei workflow er jonno ekta Personal Access Token lagbe:
# Settings -> Developer settings -> Personal access tokens (classic)
# scope: read:user, repo  -> copy kore repo te secret hisebe rakhun, nam: METRICS_TOKEN

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "profile/**"
      - "metrics/**"
      - "profile-3d-contrib/**"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Language breakdown (detailed bar chart)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Dhaka
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss

      # Coding habits: kon somoy/din e beshi code koren
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Dhaka
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_days: 30

      # Isometric contribution calendar with streak & average
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Dhaka
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # GitHub achievements (badges)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Dhaka
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
